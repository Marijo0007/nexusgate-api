# ============================================
# CONFIGURACIÓN DE LA APLICACIÓN
# Archivo: src/main/resources/application.properties
# ============================================

# Puerto del servidor
server.port=${PORT:8080}

# Nombre de la aplicación
spring.application.name=coworking-access-api

# ============================================
# BASE DE DATOS - Desarrollo Local
# ============================================
spring.datasource.url=jdbc:${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# ============================================
# JPA / HIBERNATE
# ============================================
# validate: verifica que las entidades coincidan con BD (no modifica)
# update:   actualiza el esquema si hay cambios (útil en desarrollo)
# create:   borra y recrea las tablas (¡CUIDADO! Solo para pruebas)
spring.jpa.hibernate.ddl-auto=update

# Muestra las queries SQL en la consola (útil para debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto específico de PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================
# SERIALIZACIÓN JSON
# ============================================
# No incluir campos null en el JSON de respuesta
spring.jackson.default-property-inclusion=non_null
# Formato de fechas en JSON
spring.jackson.serialization.write-dates-as-timestamps=false