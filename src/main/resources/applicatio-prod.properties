# ============================================
# CONFIGURACIÓN DE PRODUCCIÓN - RENDER (POSTGRESQL)
# ============================================

# 1. Conexión a la Base de Datos
# IMPORTANTE: Render entrega la URL como 'postgres://...', pero JDBC necesita 'jdbc:postgresql://'
spring.datasource.url=jdbc:${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Configuración de JPA / Hibernate
# El dialecto le dice a Hibernate cómo hablar con PostgreSQL específicamente
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# 'update' crea las tablas automáticamente si no existen al arrancar
spring.jpa.hibernate.ddl-auto=update
# Desactivar SQL en logs para mayor seguridad y rendimiento en producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 3. Optimización de Pool de Conexiones (HikariCP)
# Limitamos el pool para no agotar la memoria del plan Gratuito de Render (512MB)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=NexusGateCloudPool

# 4. Ajustes del Servidor
# Render asigna el puerto dinámicamente mediante la variable de entorno PORT
server.port=${PORT:8080}

# 5. Serialización JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false