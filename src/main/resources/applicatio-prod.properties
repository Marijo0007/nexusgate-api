# ============================================
# CONFIGURACIÓN PRODUCCIÓN - RENDER
# Las variables de entorno las configuras en Render Dashboard
# ============================================

# En producción, la URL de BD viene de variable de entorno
spring.datasource.url=${SPRING_DATASOURCE_URL}
# En producción, el username y password de BD vienen de variables de entorno
spring.datasource.username=${DB_USERNAME}
# En producción, el username y password de BD vienen de variables de entorno
spring.datasource.password=${DB_PASSWORD}
# En producción, el driver de BD viene de variable de entorno
spring.jpa.hibernate.ddl-auto=update
# En producción, el dialecto de BD viene de variable de entorno
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# En producción, el puerto del servidor viene de variable de entorno
server.port=${PORT:8080}