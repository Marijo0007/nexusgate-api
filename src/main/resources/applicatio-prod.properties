# ============================================
# CONFIGURACIÓN PRODUCCIÓN - RENDER
# Las variables de entorno las configuras en Render Dashboard
# ============================================

# En producción, la URL de BD viene de variable de entorno
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# En producción: validate (no modificar esquema automáticamente)
spring.jpa.hibernate.ddl-auto=validate

# No mostrar SQL en producción (rendimiento y seguridad)
spring.jpa.show-sql=false

# Puerto dinámico que Render asigna
server.port=${PORT:8080}